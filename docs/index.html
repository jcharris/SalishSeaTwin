<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Salish Sea Oceanographic Twin</title>

  <!-- 1. Stylesheets -->
  <link rel="stylesheet" href="css/style.css">
  <link href="https://unpkg.com/maplibre-gl@3.6.0/dist/maplibre-gl.css" rel="stylesheet" />

  <!-- 2. Global External Libraries (MUST load before ES modules) -->
  <script src="https://unpkg.com/maplibre-gl@3.6.0/dist/maplibre-gl.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>

  <!-- 3. Application Entry Module -->
  <script type="module" src="js/app.js?v=1.0.3"></script>
</head>
<body>

  <div id="ui-panel">
    <h3>Salish Sea Digital Twin</h3>
    <p>Developed by <strong>Jeffrey Harris / ENPC</strong></p>
    <p id="layer-status" style="color: #38bdf8; margin-top: 4px;">Active Layer: Water Level (TWL)</p>
  </div>

  <div id="map"></div>

  <!-- Variable Switcher -->
  <div id="variable-selector">
    <button class="var-btn active" data-var="twl">TWL</button>
    <button class="var-btn" data-var="tide">Tide</button>
    <button class="var-btn" data-var="surge">Surge</button>
    <button class="var-btn" data-var="temp">Temp</button>
    <button class="var-btn" data-var="salinity">Salinity</button>
  </div>

  <!-- Bottom Time Control Dock -->
  <div id="time-controller" class="time-bar-container">
  <button id="play-btn" class="time-btn" title="Play/Pause">▶</button>
  
  <div class="step-controls">
    <button id="step-back-btn" class="time-btn-step" title="Previous Hour">&lsaquo;</button>
    <button id="step-fwd-btn" class="time-btn-step" title="Next Hour">&rsaquo;</button>
  </div>

  <input type="range" id="time-slider" min="0" max="71" value="0" step="1">

  <!-- Interactive UTC Readout Badge with Picker Overlay -->
  <div class="time-picker-wrapper">
  <span id="time-readout" class="time-badge">Sep 01, 2026 — 00:00 UTC 📅</span>
  <input type="datetime-local" id="exact-picker" class="hidden-picker" step="3600">
</div>
  </div>

  <!-- Contextual Chart Drawer -->
  <div id="chart-drawer">
  <div class="drawer-header">
    <div>
      <div class="drawer-title" id="drawer-title">Station Data</div>
      <div class="drawer-sub" id="drawer-sub">Select variable to view</div>
    </div>
    <button class="close-btn" id="close-drawer-btn">&times;</button>
  </div>
  
  <!-- MUST match id="chart-box" -->
  <div id="chart-box" class="chart-box"></div>
  </div>

  <!-- Floating Update Banner -->
  <div id="update-toast" style="
    display: none; position: absolute; top: 15px; left: 50%; transform: translateX(-50%);
    z-index: 100; background: #0284c7; color: white; padding: 8px 16px; border-radius: 20px;
    font-size: 11px; font-weight: 600; box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    cursor: pointer; backdrop-filter: blur(8px); border: 1px solid rgba(255,255,255,0.3);
  ">
    ✨ Update Available! Tap to Refresh
  </div>

  <!-- Entry Script (ES Module) -->
  <script type="module" src="js/app.js?v=1.0.3"></script>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(err => console.warn('SW registration failed:', err));
    }
  </script>
</body>
</html>
